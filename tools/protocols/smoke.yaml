# Protocollo corto di collaudo della catena: non e' un test di policy, serve solo a verificare
# che avvio, transizioni, rilascio della corda, comandi e logging funzionino end-to-end.
name: smoke
nominal_height: 0.98
deepest_height: 0.60
# rampe del target di quota del CONTROLLER (observations.h): il joystick scriptato le usa per
# sapere quanto tenere RT/B. Se il controller cambia, cambiare qui, o le quote arrivano sbagliate.
descend_rate: 0.05
rise_rate: 0.05
band_release_at: 12.0
stop_at: 40.0
timeline:
  - {t:  2.0, do: fixstand}
  - {t:  8.0, do: rl}
  - {t: 14.0, vx: 0.0, vy: 0.0, wz: 0.0}
  - {t: 20.0, vx: 1.0}
  - {t: 28.0, vx: 0.0}
  - {t: 32.0, height: 0.74}
