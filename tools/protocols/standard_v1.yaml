# ============================================================================================
# PROTOCOLLO DI TEST STANDARD v1 — H1_2 squat
#
# Riproduce a macchina la stessa sessione che si faceva a mano, così che due policy diverse
# ricevano comandi IDENTICI agli stessi istanti e i numeri siano confrontabili.
#
# REGOLA: questo file NON si modifica per adattarlo a una policy. Se serve una manovra nuova si
# crea standard_v2.yaml e si dichiara nel report quale versione è stata usata; i confronti valgono
# solo fra run dello stesso protocollo.
#
# Semantica: ogni voce ha un istante `t` (tempo di SIMULAZIONE, s) e uno stato APPICCICOSO —
# vx/vy/wz/height valgono finché non li cambia una voce successiva. `do` è invece un impulso.
# vx,vy in m/s; wz in rad/s; height in m (il controller ci arriva con la sua rampa da 0.15 m/s,
# quindi lascia sempre ~2 s di margine dopo un cambio di quota).
#
# Le ampiezze sono a fondo corsa dei range di training: vx ∈ [-0.3, 1.0], vy ∈ [-0.3, 0.3],
# wz ∈ [-0.5, 0.5]. Sono i valori PRIMA dello scaling per profondità, che applica il controller.
# ============================================================================================
name: standard_v1
nominal_height: 0.98
deepest_height: 0.60
band_release_at: 12.0
stop_at: 262.0

timeline:
  # ---- avvio ---------------------------------------------------------------------------
  - {t:   2.0, do: fixstand}          # LT + su      (rampa di 3 s verso la posa di stand)
  - {t:   8.0, do: rl}                # RB + X       (avvio della policy)
  # a t=12.0 la corda viene rilasciata automaticamente (band_release_at)
  - {t:  14.0, vx: 0.0, vy: 0.0, wz: 0.0}

  # ---- A) stazione eretta, comando nullo: riferimento di sway/lean ----------------------
  - {t:  14.0}                        # 10 s di fermo

  # ---- B) stazione eretta, i sei assi, 9 s ciascuno con 4 s di ritorno a zero -----------
  - {t:  24.0, vx:  1.0}
  - {t:  33.0, vx:  0.0}
  - {t:  37.0, vx: -0.3}
  - {t:  46.0, vx:  0.0}
  - {t:  50.0, vy:  0.3}
  - {t:  59.0, vy:  0.0}
  - {t:  63.0, vy: -0.3}
  - {t:  72.0, vy:  0.0}
  - {t:  76.0, wz:  0.5}
  - {t:  85.0, wz:  0.0}
  - {t:  89.0, wz: -0.5}
  - {t:  98.0, wz:  0.0}

  # ---- C) scala di quote da fermo: tracking, lean, coppia di caviglia -------------------
  - {t: 102.0, height: 0.85}
  - {t: 110.0, height: 0.74}
  - {t: 118.0, height: 0.66}
  - {t: 126.0, height: 0.60}
  - {t: 148.0, height: 0.98}          # 22 s a fondo squat: è la tenuta lunga da difendere

  # ---- D) mezzo squat 0.74 m, gli stessi sei assi ---------------------------------------
  - {t: 156.0, height: 0.74}
  - {t: 162.0, vx:  1.0}
  - {t: 171.0, vx:  0.0}
  - {t: 175.0, vx: -0.3}
  - {t: 184.0, vx:  0.0}
  - {t: 188.0, vy:  0.3}
  - {t: 197.0, vy:  0.0}
  - {t: 201.0, vy: -0.3}
  - {t: 210.0, vy:  0.0}
  - {t: 214.0, wz:  0.5}
  - {t: 223.0, wz:  0.0}
  - {t: 227.0, wz: -0.5}
  - {t: 236.0, wz:  0.0}

  # ---- E) ritorno in piedi e fermo finale ------------------------------------------------
  - {t: 240.0, height: 0.98}
  - {t: 250.0}
